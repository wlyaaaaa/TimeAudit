apiVersion: 1
# Private dashboard snapshots stay outside this provider; use restore_grafana.py
# so a container restart cannot overwrite their newer UI edits.
# website-computer-status.json is a dedicated hardware-only file-provisioned draft.
# File provisioning does not enable its external share; that needs Grafana admin access.
providers:
  - name: 'TimeAudit Automated Dashboards'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    editable: true             # 允许你在新电脑上继续任意增删、修改卡片
    options:
      path: /etc/grafana/provisioning/dashboards
