apiVersion: 1
# Dashboard JSON is intentionally not mounted into this provider directory.
# Use restore_grafana.py so a container restart cannot overwrite newer UI edits.
providers:
  - name: 'TimeAudit Automated Dashboards'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    editable: true             # 允许你在新电脑上继续任意增删、修改卡片
    options:
      path: /etc/grafana/provisioning/dashboards
