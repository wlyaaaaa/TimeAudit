version: '3.8'

services:
  # 🗄️ 核心持久层：选用对时间窗口查询、长周期聚合最优雅的 PostgreSQL
  audit-db:
    image: postgres:15-alpine
    container_name: audit-postgres
    restart: always
    environment:
      POSTGRES_USER: 'leyang'
      POSTGRES_PASSWORD: 'SecurePassword123'
      POSTGRES_DB: 'time_audit'
    ports:
      - "55432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    # /dev/shm 上限：并行查询(posix DSM)扫描大分区(fact_process_activity 周分区已达 ~1.8GB)时在此申请共享内存，
    # Docker 默认 64MB 过小会触发 "could not resize shared memory segment ... No space left on device"。
    # 512MB 已远超实际所需——DSM 用量受 work_mem(4MB) × 并行度(max_parallel_workers_per_gather=2) 约束，
    # 与物理内存无关，切勿按 64GB 内存比例放大(那只会让失控查询经 tmpfs 吃光内存)。tmpfs 惰性分配，闲时实占≈0。
    shm_size: '512mb'

  # 🚀 异步数据管道：负责无感将 AHK 写入的 CSV 批量拍进数据库
  audit-ingest:
    build: .                           # ⚡ 核心修改：让 Docker 读刚才写的 Dockerfile [cite: 94]
    container_name: audit-ingester
    restart: always
    depends_on:
      - audit-db
    volumes:
      - ./log:/log                     
      - ./ingest.py:/app/ingest.py     

  # 📊 天花板级前端：Grafana 仪表盘
  audit-dashboard:
    image: grafana/grafana-oss:latest
    container_name: audit-grafana
    restart: always
    ports:
      - "53000:3000"
    environment:
      - GF_USERS_DEFAULT_THEME=light
      - GF_PANELS_DISABLE_SANITIZE_HTML=true
    volumes:
      - E:/TimeAudit/grafana_data:/var/lib/grafana
      # 🟢 【新增核心挂载】：将本地脱水的纯文本卡片配置无感注入容器内部
      - ./grafana_provisioning:/etc/grafana/provisioning:ro