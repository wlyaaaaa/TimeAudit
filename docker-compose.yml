services:
  # 🗄️ 核心持久层：选用对时间窗口查询、长周期聚合最优雅的 PostgreSQL
  audit-db:
    image: postgres:15-alpine
    container_name: audit-postgres
    restart: always
    # 🚀 PostgreSQL 性能调优：默认 shared_buffers=128MB / work_mem=4MB 在 64GB+NVMe 机器上把性能锁死了。
    # 面向“单用户工作站、读多、大量对 fact_process_activity(~1.8GB/周分区)的聚合扫描”优化，既显著提速、
    # 又留足内存给游戏/应用(shared_buffers=2GB 仅占 64GB 的 3%)。random_page_cost/effective_io_concurrency
    # 按 NVMe Gen5 调小/调高，让规划器更敢走索引并预取。并行度保持 2，配 512MB shm 仍有充足余量。
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=2GB"
      - "-c"
      - "effective_cache_size=8GB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=512MB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "max_parallel_workers_per_gather=2"
      # 【时区修复】PG 默认会话时区=UTC，会让 "date_trunc('day', now() AT TIME ZONE 'Asia/Shanghai')"
      # 这类无时区常量与 timestamptz 列比较时偏移 8 小时(功耗舱今日/本周/本月电费能耗统计错位)。强制
      # 会话时区为北京时间，使所有"本地日界"统计与硬件老化趋势(date_trunc 按日/周/月)正确对齐；分区
      # 路由不受影响(分区边界用带 +08 的绝对 timestamptz 定义)，Grafana 时间宏($__timeFilter 等)也是
      # 绝对时刻不受影响。采集端 main.py 用 datetime.now(timezone.utc) 写入，绝对时刻同样不受影响。
      - "-c"
      - "timezone=Asia/Shanghai"
      - "-c"
      - "log_timezone=Asia/Shanghai"
    environment:
      POSTGRES_USER: 'leyang'
      POSTGRES_PASSWORD: 'SecurePassword123'
      POSTGRES_DB: 'time_audit'
    ports:
      - "55432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    # /dev/shm 上限：并行查询(posix DSM)扫描大分区(fact_process_activity 周分区已达 ~1.8GB)时在此申请共享内存，
    # Docker 默认 64MB 过小会触发 "could not resize shared memory segment ... No space left on device"。
    # 512MB 仍充足——DSM 用量受 work_mem(16MB) × 并行度(max_parallel_workers_per_gather=2) 约束，
    # 与物理内存无关，切勿按 64GB 内存比例放大(那只会让失控查询经 tmpfs 吃光内存)。tmpfs 惰性分配，闲时实占≈0。
    shm_size: '512mb'

  # 🚀 异步数据管道：负责无感将 AHK 写入的 CSV 批量拍进数据库
  audit-ingest:
    build: .                           # ⚡ 核心修改：让 Docker 读刚才写的 Dockerfile [cite: 94]
    container_name: audit-ingester
    restart: always
    depends_on:
      - audit-db
    volumes:
      - ./log:/log                     
      - ./ingest.py:/app/ingest.py     

  # 📊 天花板级前端：Grafana 仪表盘
  audit-dashboard:
    image: grafana/grafana-oss:latest
    container_name: audit-grafana
    restart: always
    ports:
      - "53000:3000"
    environment:
      - GF_USERS_DEFAULT_THEME=light
      - GF_PANELS_DISABLE_SANITIZE_HTML=true
    volumes:
      - E:/Projects/Tools/TimeAudit/grafana_data:/var/lib/grafana
      # 🟢 【新增核心挂载】：将本地脱水的纯文本卡片配置无感注入容器内部
      - ./grafana_provisioning:/etc/grafana/provisioning:ro