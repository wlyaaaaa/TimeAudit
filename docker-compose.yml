version: '3.8'

services:
  # 🗄️ 核心持久层：选用对时间窗口查询、长周期聚合最优雅的 PostgreSQL
  audit-db:
    image: postgres:15-alpine
    container_name: audit-postgres
    restart: always
    environment:
      POSTGRES_USER: 'leyang'
      POSTGRES_PASSWORD: 'SecurePassword123'
      POSTGRES_DB: 'time_audit'
    ports:
      - "55432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

  # 🚀 异步数据管道：负责无感将 AHK 写入的 CSV 批量拍进数据库
  audit-ingest:
    build: .                           # ⚡ 核心修改：让 Docker 读刚才写的 Dockerfile
    container_name: audit-ingester
    restart: always
    depends_on:
      - audit-db
    volumes:
      - ./log:/log                     
      - ./ingest.py:/app/ingest.py     
    # ❌ 删除了以前那串长长的 command 网络下载命令

  # 📊 天花板级前端：Grafana 仪表盘
  audit-dashboard:
    image: grafana/grafana-oss:latest
    container_name: audit-grafana
    restart: always
    ports:
      - "53000:3000"
    environment:
      - GF_USERS_DEFAULT_THEME=light
      - GF_PANELS_DISABLE_SANITIZE_HTML=true
    volumes:
      - E:/TimeAudit/grafana_data:/var/lib/grafana